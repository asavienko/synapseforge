name: CI/CD — Test & Deploy

on:
  push:
    branches: [develop]
    paths:
      - "web/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "web/**"

defaults:
  run:
    working-directory: web

jobs:
  test:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL:       ${{ secrets.DATABASE_URL }}
      DIRECT_URL:         ${{ secrets.DIRECT_URL }}
      AUTH_SECRET:        ${{ secrets.AUTH_SECRET }}
      NEXTAUTH_URL:       http://localhost:3000
      AUTH_TRUST_HOST:    true
      DISABLE_RATE_LIMIT: true
      RESEND_API_KEY:     ${{ secrets.RESEND_API_KEY }}
      ADMIN_EMAILS:       ${{ secrets.ADMIN_EMAILS }}
      STRIPE_SECRET_KEY:  ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRO_PRICE_ID: ${{ secrets.STRIPE_PRO_PRICE_ID }}
      STRIPE_ENTERPRISE_PRICE_ID: ${{ secrets.STRIPE_ENTERPRISE_PRICE_ID }}
      INTERNAL_API_KEY:         test-internal-key
      ENCRYPTION_KEY:           test-encryption-key-32-chars-ok!

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply DB migrations
        run: npx prisma migrate deploy
        working-directory: web

      - name: Seed test user
        run: npx tsx cypress/support/seed.ts

      - name: Build app
        run: npm run build

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: web
          start: npm run start
          wait-on: http://localhost:3000
          wait-on-timeout: 120
          browser: chrome
          record: false
        env:
          DATABASE_URL:       ${{ secrets.DATABASE_URL }}
          DIRECT_URL:         ${{ secrets.DIRECT_URL }}
          AUTH_SECRET:        ${{ secrets.AUTH_SECRET }}
          NEXTAUTH_URL:       http://localhost:3000
          AUTH_TRUST_HOST:    true
          DISABLE_RATE_LIMIT: true
          INTERNAL_API_KEY: test-internal-key

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-screenshots
          path: web/cypress/screenshots
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test results summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-results
          path: web/cypress/results
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: test
    # Only deploy on push to develop (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest
        working-directory: web

      - name: Install dependencies
        run: npm install

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Apply DB migrations (production)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deployment complete
        run: echo "✅ Deployed to https://synapseforge-mu.vercel.app"
