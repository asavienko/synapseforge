name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  NODE_VERSION: '22'

jobs:
  # ── Type check + lint (fast gate, ~2 min) ────────────────────────────────────
  setup:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synapseforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm install
      - run: cd web && npx prisma generate
      - name: Run database migrations
        run: cd web && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synapseforge_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/synapseforge_test
      - run: cd web && npm run type-check
      - run: cd web && npm run lint
      - run: cd web && npm run test:unit

  # ── Deploy immediately after setup passes ────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: setup
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm install
      - name: Generate Prisma client
        run: cd web && npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_URL }}
      - name: Run production migrations
        run: cd web && npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_URL }}
      - name: Build application
        run: cd web && npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
      - name: Deploy to production
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./web
          vercel-args: '--prod'

  # ── E2E tests run in parallel with deploy — failures are informational ────────
  e2e-group-1:
    runs-on: ubuntu-latest
    needs: setup
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synapseforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm install
      - run: cd web && npx prisma generate
      - name: Run database migrations
        run: cd web && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synapseforge_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/synapseforge_test
      - name: Seed test user
        run: cd web && rm -f .env && npx tsx cypress/support/seed.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synapseforge_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/synapseforge_test
      - name: Run E2E Tests - Group 1 (Core/Auth)
        uses: cypress-io/github-action@v6
        with:
          working-directory: web
          build: npm run build
          start: npm start
          wait-on: 'http://localhost:3000/api/health'
          wait-on-timeout: 120
          browser: chrome
          spec: 'cypress/e2e/01-landing.cy.ts,cypress/e2e/02-auth.cy.ts,cypress/e2e/03-onboarding.cy.ts'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synapseforge_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/synapseforge_test
          NEXTAUTH_SECRET: test-secret
          NEXTAUTH_URL: http://localhost:3000
          AUTH_TRUST_HOST: true
          ENCRYPTION_KEY: test-encryption-key-for-ci-minimum-32-chars-long
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-results-group-1
          path: web/cypress/results

