name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  NODE_VERSION: '22'

jobs:
  # Setup job: install deps, build, prepare for parallel tests
  setup:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synapseforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          cd web
          npm install

      - name: Generate Prisma client
        run: |
          cd web
          npx prisma generate

      - name: Run database migrations
        run: |
          cd web
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synapseforge_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/synapseforge_test

      - name: Seed test user for Cypress
        run: |
          cd web
          rm -f .env
          npx tsx cypress/support/seed.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synapseforge_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/synapseforge_test

      - name: Run type checking
        run: |
          cd web
          npm run type-check

      - name: Run linter
        run: |
          cd web
          npm run lint

      - name: Run unit tests
        run: |
          cd web
          npm run test:unit

      - name: Build application
        run: |
          cd web
          npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synapseforge_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/synapseforge_test
          NEXTAUTH_SECRET: test-secret
          NEXTAUTH_URL: http://localhost:3000
          AUTH_TRUST_HOST: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: web/.next
          retention-days: 1

  # Parallel E2E Test Groups
  e2e-group-1:
    runs-on: ubuntu-latest
    needs: setup
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synapseforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          cd web
          npm install

      - name: Generate Prisma client
        run: |
          cd web
          npx prisma generate

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: web/.next

      - name: Run database migrations
        run: |
          cd web
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synapseforge_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/synapseforge_test

      - name: Seed test user
        run: |
          cd web
          rm -f .env
          npx tsx cypress/support/seed.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synapseforge_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/synapseforge_test

      - name: Run E2E Tests - Group 1 (Core/Auth)
        uses: cypress-io/github-action@v6
        with:
          working-directory: web
          start: npm start
          wait-on: 'http://localhost:3000/api/health'
          wait-on-timeout: 120
          browser: chrome
          spec: 'cypress/e2e/01-landing.cy.ts,cypress/e2e/02-auth.cy.ts,cypress/e2e/03-onboarding.cy.ts'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synapseforge_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/synapseforge_test
          NEXTAUTH_SECRET: test-secret
          NEXTAUTH_URL: http://localhost:3000
          AUTH_TRUST_HOST: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-results-group-1
          path: web/cypress/results

