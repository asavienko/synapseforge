          spec: 'cypress/e2e/21-usage.cy.ts,cypress/e2e/22-rate-limiting.cy.ts,cypress/e2e/23-provision-timeout.cy.ts,cypress/e2e/24-token-tracking.cy.ts,cypress/e2e/25-health-alerts.cy.ts,cypress/e2e/26-plan-enforcement.cy.ts,cypress/e2e/27-managed-instance-journey.cy.ts,cypress/e2e/28-tool-integrations.cy.ts,cypress/e2e/29-sandbox-mode.cy.ts,cypress/e2e/30-public-chat.cy.ts,cypress/e2e/31-version-management.cy.ts'
